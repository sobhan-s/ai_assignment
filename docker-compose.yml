version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    environment:
      # API connects as the standard RW user to log queries
      - POSTGRES_USER=genai_user
      - POSTGRES_PASSWORD=genai_password
      - POSTGRES_DB=genai_db
      - POSTGRES_URL=postgresql://genai_user:genai_password@postgres:5432/genai_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - genai_net

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=genai_user
      - POSTGRES_PASSWORD=genai_password
      - POSTGRES_DB=genai_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - genai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai_user -d genai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - genai_net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - genai_net

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:

networks:
  genai_net:
    driver: bridge
