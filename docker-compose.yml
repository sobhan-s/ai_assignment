services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./data/documents:/code/data/documents
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:admin123@postgres:5432/genai_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - genai-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: genai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d genai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genai-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - genai-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - genai-network

  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    networks:
      - genai-network
    command: >
      sh -c "
      echo 'Waiting for Ollama to start...' &&
      sleep 10 &&
      echo 'Pulling Nomic Embeddings...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}' &&
      echo 'Pulling Llama 3.1 8B (this might take a while)...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.1:8b\"}'
      "

networks:
  genai-network:
    driver: bridge

volumes:
  pgdata:
  qdrant_storage:
  ollama_models:
