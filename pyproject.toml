[project]
name = "local-genai-data-assistant"
version = "0.1.0"
description = "A local GenAI assistant with RAG and SQL agent capabilities."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "langgraph>=0.2.14",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-ollama>=0.2.0",                  
    "langchain-openai>=0.2.0",                  
    "langchain-anthropic>=0.3.0",               
    "langchain-groq>=0.2.0",                    
    "langchain-google-genai>=2.0.0",            
    "langchain-huggingface>=0.1.0",
    "qdrant-client>=1.11.3",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "sqlglot>=25.18.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    # Type stubs
    "types-docutils",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
]
ignore = [
    "E501",  # Line length is handled by ruff format; multiline strings/prompts preserved
    "ANN401",  # Dynamically typed expressions (typing.Any) in flexible interfaces
    "B008",  # Do not perform function call in argument defaults (standard in FastAPI Depends/File)
    "N818",  # Exception name should be named with an Error suffix
    "ANN204",  # Missing return type annotation for special method __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",   # Type annotations not mandatory on test methods and fixtures
    "N806",  # Variable names in tests
    "C408",  # Unnecessary dict calls in test helpers
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "sqlglot.*",
    "qdrant_client.*",
    "structlog.*",
    "langchain_huggingface.*",
    "langchain_groq.*",
    "langchain_anthropic.*",
    "langchain_google_genai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --asyncio-mode=auto"
testpaths = [
    "tests",
]
